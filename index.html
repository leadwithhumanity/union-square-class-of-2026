<style id="css">
/* Layout: a Michigan-fall commencement program. Cream ground, maple and goldenrod accents, logo orange on the price only. Photos shown whole, never cropped. */
:root{
  --bg:#FAF4EA; --paper:#FFFFFF; --ink:#2C221D; --muted:#7A6A5F; --line:#E9DCCB;
  --cream2:#F3E7D3; --maple:#B5402C; --gold:#D89E2F; --moss:#6E7B45; --bark:#5A463B;
  --accent:#E8732A; --accent-ink:#B5521A; --accent-soft:#FDEBDD;
  --sky:#D9E5F8; --sold:#8E8279; --pending:#D89E2F; --ok:#5E7A3C;
  --display:"Bricolage Grotesque","Inter Tight","Helvetica Neue",Arial,sans-serif; --sans:"DM Sans","Inter","Segoe UI",system-ui,sans-serif;
  --shadow:0 1px 2px rgba(44,34,29,.06),0 14px 34px -18px rgba(44,34,29,.28);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1C1512; --paper:#27201B; --ink:#F3E9DD; --muted:#B5A496; --line:#3E342D; --cream2:#2F2721;
  --maple:#E0654F; --gold:#E4B45A; --moss:#9AAB6A; --bark:#C9B4A3; --accent:#F08A47; --accent-ink:#FFB37E; --accent-soft:#3B2A1F;
  --sky:#2A3650; --sold:#7A6F66; --pending:#E4B45A; --ok:#8DB36A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px -18px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1512; --paper:#27201B; --ink:#F3E9DD; --muted:#B5A496; --line:#3E342D; --cream2:#2F2721;
  --maple:#E0654F; --gold:#E4B45A; --moss:#9AAB6A; --bark:#C9B4A3; --accent:#F08A47; --accent-ink:#FFB37E; --accent-soft:#3B2A1F;
  --sky:#2A3650; --sold:#7A6F66; --pending:#E4B45A; --ok:#8DB36A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px -18px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
h1,h2,h3{text-wrap:balance;margin:0}
.eyebrow{font-size:.74rem;letter-spacing:.18em;text-transform:uppercase;color:var(--maple);font-weight:600}

/* Hero */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line);
  background:
   radial-gradient(60% 80% at 100% 0%,color-mix(in srgb,var(--gold) 22%,transparent) 0%,transparent 60%),
   radial-gradient(50% 70% at 0% 100%,color-mix(in srgb,var(--maple) 14%,transparent) 0%,transparent 60%),
   var(--bg)}
.hero .wrap{display:grid;grid-template-columns:auto 1fr minmax(260px,380px);gap:34px;align-items:center;padding-block:34px 26px}
.heropic{border-radius:999px 999px 18px 18px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line);aspect-ratio:4/5;background:var(--sky)}
.heropic img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block}
.heropic figcaption{display:none}
.logo{width:150px;aspect-ratio:315/530;border-radius:999px 999px 16px 16px;overflow:hidden;background:var(--sky);box-shadow:var(--shadow);border:1px solid var(--line)}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(3rem,5.4vw,4.6rem);line-height:.92;letter-spacing:-.035em;font-variation-settings:"opsz" 96,"wdth" 92}
.hero h1 em{font-style:normal;font-weight:300;color:var(--maple);font-variation-settings:"opsz" 96,"wdth" 80}
.lockup{display:flex;align-items:center;gap:14px}
.salemark{font:800 clamp(2.9rem,7.2vw,5.4rem)/.84 var(--display);text-transform:uppercase;letter-spacing:-.035em;color:var(--ink);font-variation-settings:"opsz" 96,"wdth" 78}.salemark span:last-of-type{color:var(--maple)}
.salemark span{display:block}
.salemark .dates{font:600 .74rem/1.35 var(--sans);text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin-top:10px}
.salemark .twelve{font:italic 500 .95rem/1.2 var(--display);text-transform:none;letter-spacing:0;color:var(--accent-ink);margin-top:4px}
.lede{font-size:1.08rem;max-width:40rem;color:var(--muted);margin-top:14px}
.lede b{color:var(--ink);font-weight:500}
.treats{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font-family:var(--sans);font-style:italic;font-weight:500;font-size:1.05rem;color:var(--accent-ink)}
.treats .leaf{width:18px;height:18px;flex:0 0 auto}
.updated{font-size:.84rem;color:var(--muted);margin-top:10px}
.updated b{color:var(--ink);font-weight:500}

/* How it works */
.how{padding-block:22px 4px}
.how ol{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;counter-reset:step}
.how li{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;position:relative;min-width:0;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.how li::before{counter-increment:step;content:counter(step);font-family:var(--display);font-size:1.5rem;font-weight:600;color:var(--paper);background:var(--maple);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;line-height:1}
.how li b{font-weight:500;display:block}
.how li span{color:var(--muted);font-size:.93rem}

/* Sticky filter bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin-top:14px}
.bar .wrap{display:flex;gap:8px;align-items:center;padding-block:10px;overflow-x:auto;scrollbar-width:none}
.bar .wrap::-webkit-scrollbar{display:none}
.bar .sep{width:1px;height:22px;background:var(--line);flex:0 0 auto;margin:0 4px}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:7px 13px;font:500 .88rem var(--sans);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip .n{font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.7}
.chip:focus-visible,.btn:focus-visible,.price:focus-visible,.thumb:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* Sections */
section.group{padding-block:28px 4px}
.group-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--maple);padding-bottom:8px;margin-bottom:20px}
.group-head h2{font-family:var(--display);font-size:clamp(1.5rem,3vw,2.1rem);font-weight:700;letter-spacing:-.025em;display:inline-flex;align-items:center;gap:10px}
.group-head .leaf{width:22px;height:22px;color:var(--gold)}
.group-head .sub{color:var(--muted);font-size:.92rem;font-style:italic;font-family:var(--display)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px 16px;align-items:start}
.empty{background:var(--cream2);border:1px dashed var(--line);border-radius:14px;padding:22px;color:var(--muted);font-family:var(--display);font-style:italic;font-size:1.05rem;text-align:center}

/* Card */
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:10px 10px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:9px;min-width:0;position:relative;animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
.grid .card:nth-child(2){animation-delay:.06s}.grid .card:nth-child(3){animation-delay:.12s}.grid .card:nth-child(4){animation-delay:.18s}.grid .card:nth-child(5){animation-delay:.24s}.grid .card:nth-child(6){animation-delay:.3s}.grid .card:nth-child(7){animation-delay:.36s}.grid .card:nth-child(8){animation-delay:.42s}
.card:hover{transform:translateY(-2px);transition:transform .25s ease}
#leaves{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.hero .wrap{position:relative;z-index:1}
@media (prefers-reduced-motion:reduce){#leaves{display:none}.card:hover{transform:none}}
@keyframes rise{from{transform:translateY(14px);opacity:.55}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
.portrait{position:relative;border-radius:12px;overflow:hidden;background:var(--cream2);display:grid;place-items:center;min-height:150px;padding-bottom:50px}
.portrait img{width:100%;height:auto;max-height:360px;object-fit:contain;display:block;cursor:zoom-in}
.portrait .blank{display:grid;place-items:center;text-align:center;padding:26px;width:100%;min-height:200px;color:var(--muted);background:repeating-linear-gradient(135deg,var(--cream2) 0 14px,color-mix(in srgb,var(--cream2) 70%,var(--paper)) 14px 28px)}
.portrait .blank span{font-family:var(--display);font-style:italic;font-size:1rem;background:var(--paper);padding:7px 13px;border-radius:999px;border:1px solid var(--line)}
.card.bundle .portrait{display:grid;grid-template-columns:1fr 1fr;gap:4px;place-items:stretch;background:var(--paper);padding-bottom:50px}
.card.bundle .portrait img{aspect-ratio:1;max-height:none;object-fit:cover;background:var(--cream2);border-radius:8px;cursor:zoom-in}
.card.bundle .portrait img:only-child{grid-column:1/-1;aspect-ratio:auto}
.card.bundle .portrait img:first-child:nth-last-child(3){grid-column:1/-1;aspect-ratio:2/1}
.card.bundle .portrait .blank{grid-column:1/-1}
.price{position:absolute;right:8px;bottom:8px;background:var(--accent);color:#fff;text-decoration:none;font:600 1.02rem var(--sans);padding:7px 13px;border-radius:999px;box-shadow:0 6px 16px -6px rgba(0,0,0,.45);display:inline-flex;align-items:center;gap:7px;font-variant-numeric:tabular-nums;transition:transform .15s ease}
.price:hover{transform:translateY(-1px)}
.price small{font-weight:500;font-size:.7rem;opacity:.92;letter-spacing:.05em}
.tag{position:absolute;left:8px;top:8px;background:var(--moss);color:#fff;font:600 .66rem var(--sans);letter-spacing:.14em;text-transform:uppercase;padding:4px 9px;border-radius:999px;z-index:1}
.tag.pkg{background:var(--gold);color:#2C221D}
.stamp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-12deg);font:700 1.5rem var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--paper);background:var(--maple);padding:6px 16px;border-radius:6px;border:3px double var(--paper);opacity:.95;z-index:2}
.ribbon{position:absolute;left:8px;bottom:8px;background:var(--pending);color:#2C221D;font:600 .7rem var(--sans);letter-spacing:.12em;text-transform:uppercase;padding:5px 10px;border-radius:999px;z-index:2}
.card.sold .portrait img{filter:grayscale(1) contrast(.9);opacity:.6}
.card.sold .price,.card.pending .price{display:none}
.thumbs{display:flex;gap:6px}
.thumb{width:42px;height:42px;border-radius:9px;overflow:hidden;border:2px solid transparent;padding:0;background:var(--cream2);cursor:pointer}
.thumb[aria-current="true"]{border-color:var(--maple)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.name{font-family:var(--display);font-size:1.18rem;font-weight:500;line-height:1.2}
.super{font-family:var(--sans);font-style:italic;font-weight:500;color:var(--maple);font-size:.96rem;margin-top:-5px}
.desc{color:var(--muted);font-size:.92rem;margin:0}
.includes{font-size:.88rem;color:var(--ink);margin:0;padding-left:18px}
.dims{font-size:.78rem;color:var(--muted);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.note{font-size:.84rem;background:var(--accent-soft);color:var(--accent-ink);border-radius:10px;padding:6px 10px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:8px 13px;font:500 .88rem var(--sans);text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.btn[aria-disabled="true"]{opacity:.7;cursor:default}
details.why{font-size:.86rem;color:var(--muted)}
details.why summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:6px;color:var(--ink);font-weight:500}
details.why summary::-webkit-details-marker{display:none}
details.why summary::before{content:"+";font-family:var(--display);font-size:1.1rem;line-height:1;color:var(--maple)}
details.why[open] summary::before{content:"–"}
details.why p{margin:8px 0 0}
details.why a{color:var(--ink)}

/* Dialogs */
.lb,.dlg{position:fixed;inset:0;display:grid;place-items:center;z-index:50;padding:max(16px,env(safe-area-inset-left,0px))}
.lb{background:rgba(20,14,10,.92)}
.lb img{max-width:100%;max-height:88vh;border-radius:12px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.lb .x,.dlg .x{position:absolute;top:max(14px,env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));background:#fff;color:#111;border:0;border-radius:999px;width:40px;height:40px;font-size:20px;cursor:pointer}
.lb .cap{position:absolute;bottom:max(16px,env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:#fff;font-family:var(--display);font-style:italic}
.dlg{background:rgba(20,14,10,.55);z-index:55}
.dlg .box{background:var(--paper);color:var(--ink);border-radius:18px;padding:22px;max-width:460px;width:100%;box-shadow:var(--shadow);border:1px solid var(--line);position:relative}
.dlg .x{position:absolute;top:10px;right:10px;width:34px;height:34px;background:var(--cream2);color:var(--ink)}
.dlg h3{font-family:var(--display);font-weight:500;font-size:1.35rem;padding-right:40px}
.dlg p{color:var(--muted);font-size:.92rem;margin:6px 0 10px}
.dlg label{display:block;font-size:.76rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:10px}
.dlg input,.dlg textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;background:var(--bg);color:var(--ink);margin-top:4px}.dlg textarea{min-height:72px;resize:vertical}
.dlg .msg{margin-top:12px;background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:.93rem;white-space:pre-wrap;user-select:all}
.dlg .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.dlg .num{font-weight:600;letter-spacing:.02em}

/* Footer */
.drill{margin-top:36px;background:var(--bark);color:#FAF4EA;border-radius:22px;padding:26px;position:relative;overflow:hidden}
.drill::after{content:"";position:absolute;right:-40px;top:-40px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--gold) 40%,transparent),transparent 70%)}
.drill h2{font-family:var(--display);font-weight:700;font-size:1.6rem;position:relative}
.drill .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:14px;position:relative}
.drill .col{min-width:0}
.drill .k{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;opacity:.75}
.drill .v{font-size:1.02rem;margin-top:4px}
.drill .v b{font-weight:600}
.copy{margin-left:8px;border:1px solid rgba(250,244,234,.45);background:transparent;color:inherit;border-radius:999px;padding:3px 10px;font:500 .76rem var(--sans);cursor:pointer}
.colophon{text-align:center;color:var(--muted);font-size:.84rem;padding-block:26px 34px}
.colophon a{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem;z-index:60;box-shadow:var(--shadow)}

/* Owner tools */
.owner{display:none;background:var(--accent-soft);border:1px dashed var(--accent);border-radius:16px;padding:14px 16px;margin-top:16px}
.owner.on{display:block}
.owner h3{font:600 .78rem var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--accent-ink)}
.owner form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px}
.owner input,.owner select,.owner textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;background:var(--paper);color:var(--ink)}
.owner textarea{grid-column:1/-1;min-height:56px}
.owner .row{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card .own{display:none;gap:6px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:8px}
body.owner-mode .card .own{display:flex}
.card .own select,.card .own input{border:1px solid var(--line);border-radius:8px;padding:4px 8px;font:inherit;font-size:.84rem;background:var(--paper);color:var(--ink);max-width:110px}

@media (max-width:760px){
  .hero .wrap{grid-template-columns:1fr;gap:16px;padding-block:24px 18px}
  .heropic{aspect-ratio:4/5;max-height:70vh;margin:0 auto;width:min(100%,420px);order:2}
  .hero .wrap>div:nth-child(2){order:3}
  .salemark{font-size:3.6rem}
  .hero .wrap{gap:20px}
  .logo{width:110px}
  .lockup{justify-content:flex-start}
  .how ol{grid-template-columns:1fr}
  .drill .cols{grid-template-columns:1fr}
  .grid{grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px 12px}
}
@media (max-width:430px){.grid{grid-template-columns:1fr 1fr;gap:12px 10px}.card{padding:8px 8px 12px}.name{font-size:1.04rem}.price{font-size:.92rem;padding:6px 10px}.btn{font-size:.8rem;padding:7px 10px}.portrait img{max-height:260px}}

oxing, as 154-year-old newsprint should have.", "dims": "approx. 11 x 16 page, 16 x 20 mat", "price": 30, "photos": ["IMG_4053"], "why": "A dealer sells the complete 16-page issue for $32 (<a href='https://www.rarenewspapers.com/view/173630' target='_blank' rel='noopener'>RareNewspapers<\/a>); single Grant pages from Harper's list at $41 (<a href='https://www.ebay.de/itm/404651260981' target='_blank' rel='noopener'>eBay<\/a>).", "status": "available", "added": "2026-10-18"}, {"id": "grant_print", "g": "art", "name": "Ulysses S. Grant, Vintage Framed Portrait Print", "sup": "Most likely to be elected to your office wall", "desc": "Seated three-quarter portrait of General Grant, printed from the Brady-era photograph, in a dark wood frame with glass. A dealer had it marked $70.", "dims": "14 x 19 framed", "price": 60, "photos": ["IMG_4032"], "why": "A comparable framed 19th-century Grant lithograph sold at auction in June 2026 for $50 (<a href='https://bid.donleyauctions.com/auction/305-relics-of-the/lot-2126-framed-ulysses-2/' target='_blank' rel='noopener'>Donley Auctions<\/a>); framed antique Grant prints list at $100 to $200.", "status": "available", "added": "2026-10-18"}, {"id": "lerire", "g": "art", "name": "Le Rire, 15 June 1895: Original Paris Magazine Cover by Charles Léandre", "sup": "Most likely to have opinions about the Académie", "desc": "The color cover of the Paris satirical weekly from its first year, drawn by Charles Léandre: the Académie française welcoming the novelist Paul Bourget. Original 1895 issue cover, matted in grey and plum. Toned with age.", "dims": "approx. 9 x 12 cover, 16 x 20 mat", "price": 40, "photos": ["IMG_4055"], "why": "A New York poster dealer asks $40 for a linen-backed Léandre Le Rire cover from the same year (<a href='https://postermuseum.com/products/le-rire-lhomme-du-devoir-poster' target='_blank' rel='noopener'>Poster Museum<\/a>).", "status": "available", "added": "2026-10-18"}, {"id": "nixon", "g": "art", "name": "Nixon   function render(){

        var h = '';

  var leafRaf=null;
  function startLeaves(){
    if(leafRaf) cancelAnimationFrame(leafRaf); leafRaf=null;
    var cv=document.getElementById('leaves'); if(!cv) return;
    if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var hero=cv.parentNode, ctx=cv.getContext('2d'), W=0,H=0, dpr=Math.min(window.devicePixelRatio||1,2);
    function size(){W=hero.clientWidth;H=hero.clientHeight;cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);}
    size(); window.addEventListener('resize',size);
    var cols=['#B5402C','#D89E2F','#E8732A','#8C5A2B'];
    var n=Math.max(8,Math.min(18,Math.round(W/70)));
    var leaves=[]; for(var i=0;i<n;i++) leaves.push(mk(true));
    function mk(any){return {x:Math.random()*W,y:any?Math.random()*H:-20,s:7+Math.random()*9,v:.25+Math.random()*.45,sw:Math.random()*Math.PI*2,sv:.01+Math.random()*.015,r:Math.random()*Math.PI*2,rv:(Math.random()-.5)*.02,c:cols[Math.floor(Math.random()*cols.length)],a:.35+Math.random()*.35};}
    function leaf(ctx,s){ctx.beginPath();ctx.moveTo(0,-s);ctx.bezierCurveTo(s*.9,-s*.6,s,s*.2,0,s);ctx.bezierCurveTo(-s,s*.2,-s*.9,-s*.6,0,-s);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(0,-s*.8);ctx.lineTo(0,s*.9);ctx.strokeStyle='rgba(0,0,0,.15)';ctx.lineWidth=1;ctx.stroke();}
    var last=0;
    function tick(t){
      if(document.hidden){leafRaf=requestAnimationFrame(tick);return;}
      var dt=Math.min(40,t-last||16); last=t;
      ctx.clearRect(0,0,W,H);
      leaves.forEach(function(l){
        l.y+=l.v*dt*.06; l.sw+=l.sv*dt*.06; l.x+=Math.sin(l.sw)*.35; l.r+=l.rv*dt*.06;
        if(l.y>H+20){var m=mk(false);for(var k in m)l[k]=m[k];}
        ctx.save();ctx.globalAlpha=l.a;ctx.translate(l.x,l.y);ctx.rotate(l.r);ctx.fillStyle=l.c;leaf(ctx,l.s);ctx.restore();
      });
      leafRaf=requestAnimationFrame(tick);
    }
    leafRaf=requestAnimationFrame(tick);
  }

  function toast(msg){var r=document.getElementById('toast-root');r.innerHTML='<div class="toast">'+esc(msg)+'</div>';setTimeout(function(){r.innerHTML='';},2400);}
  function copyText(v){try{navigator.clipboard.writeText(v).then(function(){toast('Copied');},function(){toast('Select the text to copy it');});}catch(err){toast('Select the text to copy it');}}

  function openDialog(it,mode){

    root.innerHTML = '<div class="dlg" role="dialog" aria-label="'+esc(title)+'"><div class="box"><button class="x" type="button" aria-label="Close">×</button><h3>'+esc(title)+'</h3><p>'+esc(intro)+'</p>'+
      (mode==='offer'?'<label for="offer-amt">Your offer</label><input id="offer-amt" type="number" inputmode="numeric" placeholder="e.g. '+Math.round(it.price*0.8)+'">':'')+
      (mode==='ask'?'<label for="offer-q">Your question</label><textarea id="offer-q" placeholder="e.g. Does the glass come out? Could I see it Tuesday?"></textarea>':'')+
      '<label for="offer-name">Your name</label><input id="offer-name" type="text" placeholder="So we know who’s coming">'+
      '<div class="msg" id="offer-msg"></div>'+
      '<div class="acts"><a class="btn primary" id="offer-sms" href="#" target="_blank" rel="noopener">Open in Messages</a><button class="btn" type="button" id="offer-copy">Copy the text</button><span class="num">'+esc(state.textName)+': '+esc(state.textPhone)+'</span></div>'+
      '<p style="margin-top:10px">If the Messages button does nothing on your device, copy the text and send it to the number above.</p></div></div>';
    function build(){
      var name=(document.getElementById('offer-name').value||'').trim();
      var amt=mode==='offer'?Number((document.getElementById('offer-amt')||{}).value):it.price;
      var nm = it.name.replace(/^the\s+/i,'');
      var q=mode==='ask'?((document.getElementById('offer-q')||{}).value||'').trim():'';
      var txt = mode==='claim'
        ? 'Hi '+state.textName+', I’ll take the '+nm+' from the Union Square sale at '+money(it.price)+', cash at pickup.'+(name?' – '+name:'')
        : mode==='ask'
        ? 'Hi '+state.textName+', quick question about the '+nm+' from the Union Square sale: '+(q||'____')+(name?' – '+name:'')
        : 'Hi '+state.textName+', I’d like to offer '+(amt?money(amt):'$____')+' for the '+nm+' from the Union Square sale.'+(name?' – '+name:'');
      document.getElementById('offer-msg').textContent=txt;
      document.getElementById('offer-sms').href='sms:'+state.textE164+'?&body='+encodeURIComponent(txt);
      return txt;
    }
    build();
    root.querySelectorAll('input,textarea').forEach(function(i){i.addEventListener('input',build);});
    document.getElementById('offer-copy').addEventListener('click',function(){copyText(build());});
    var first=root.querySelector('textarea,input'); if(first) first.focus();
  }

  app.addEventListener('click',function(e){
    var t = e.target.closest('[data-f]');
    if(t){filter=t.getAttribute('data-f');render();return;}
    var b = e.target.closest('[data-b]');
    if(b){band=b.getAttribute('data-b');render();return;}
    var th = e.target.closest('.thumb');
    if(th){var cd=th.closest('.card');cd.querySelector('.portrait img').src=th.getAttribute('data-src');cd.querySelectorAll('.thumb').forEach(function(x){x.setAttribute('aria-current',x===th);});return;}
    var im = e.target.closest('img[data-lb]');
    if(im){var it=find(im.getAttribute('data-lb'));document.getElementById('lb-root').innerHTML='<div class="lb" role="dialog" aria-label="'+esc(it.name)+'"><button class="x" type="button" aria-label="Close">×</button><img src="'+esc(im.src)+'" alt="'+esc(it.name)+'"><div class="cap">'+esc(it.name)+' &middot; '+money(it.price)+'</div></div>';return;}
    if(e.target.closest('.lb')){ if(!e.target.closest('.lb img')) document.getElementById('lb-root').innerHTML=''; return;}
    var cl = e.target.closest('[data-claim]'); if(cl){openDialog(find(cl.getAttribute('data-claim')),'claim');return;}
    var of = e.target.closest('[data-offer]'); if(of){openDialog(find(of.getAttribute('data-offer')),'offer');return;}
    var ak = e.target.closest('[data-ask]'); if(ak){openDialog(find(ak.getAttribute('data-ask')),'ask');return;}
    if(e.target.closest('.dlg .x') || (e.target.classList && e.target.classList.contains('dlg'))){document.getElementById('dlg-root').innerHTML='';return;}
    var cp = e.target.closest('[data-copy]'); if(cp){copyText(cp.getAttribute('data-copy'));return;}
    var rm = e.target.closest('[data-own="remove"]');
    if(rm){var id=rm.getAttribute('data-id');state.items=state.items.filter(function(i){return i.id!==id;});render();toast('Removed. Save to publish.');return;}
  });
  app.addEventListener('change',function(e){
    var el=e.target.closest('[data-own]'); if(!el) return;
    var it=find(el.getAttribute('data-id')); if(!it) return;
    if(el.getAttribute('data-own')==='status'){it.status=el.value;render();}
    if(el.getAttribute('data-own')==='price'){it.price=Number(el.value)||it.price;}
  });
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){document.getElementById('lb-root').innerHTML='';document.getElementById('dlg-root').innerHTML='';}});

  function buildDocument(){
    var css = document.getElementById('css').textContent;
    var js = document.getElementById('app-js').textContent;
    var head = '<title>Union Square Class of 2026</title>\n\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=DM+Sans:ital,opsz,wght@0,9..40,300..800;1,9..40,300..800&display=swap">\n';
    var reset = ':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
    state.updated = new Date().toISOString().slice(0,10);
    var json = JSON.stringify(state).replace(/<\//g,'<\\/');
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'+head+'<style id="css">'+css+'</style>\n<div id="app"></div>\n<script id="state" type="application/json">'+json+'<\/script>\n<script id="app-js">'+js+'<\/script></body></html>';
  }

  app.addEventListener('submit',function(e){
    var f=e.target.closest('#add'); if(!f) return; e.preventDefault();
    var fd=new FormData(f);
    var it={id:'i'+Date.now().toString(36),g:fd.get('g'),name:fd.get('name'),sup:fd.get('sup')||'',desc:fd.get('desc')||'',dims:fd.get('dims')||'',price:Number(fd.get('price'))||0,status:'available',photos:[],why:'',added:new Date().toISOString().slice(0,10)};
    var file=fd.get('photo'); var msg=document.getElementById('owner-msg');
    var done=function(){state.items.push(it);render();toast('Added. Save to publish.');};
    if(file && file.size && caps.assets){
      msg.textContent='Uploading photo…';
      caps.assets.upload(file).then(function(r){it.photos=[r.url];done();},function(err){msg.textContent='Photo upload failed ('+(err&&err.code||'error')+'); item added without it.';done();});
    } else done();
  });
  app.addEventListener('click',function(e){
    if(e.target.closest('#viewas')){owner=false;render();toast('Showing the visitor view. Reload the page to get the owner tools back.');return;}
    if(!e.target.closest('#save')) return;
    var msg=document.getElementById('owner-msg');
    if(!caps.artifact){msg.textContent='Saving is not available in this view.';return;}
    msg.textContent='Publishing…';
    caps.artifact.publish(buildDocument()).then(function(){msg.textContent='Published.';},function(err){msg.textContent=(err&&err.code==='conflict')?'Someone else saved first; reloading.':'Could not publish ('+(err&&err.code||'error')+').';});
  });

  render();

  if(window.claude && window.claude.use){
    Promise.all([claude.use('user'),claude.use('artifact'),claude.use('assets')]).then(function(r){
      var user=r[0]; caps.artifact=r[1]; caps.assets=r[2];
      if(user && typeof user.canEdit==='function'){ Promise.resolve(user.canEdit()).then(function(ok){ if(ok){owner=true;render();} }); }
    }).catch(function(){});
  }
})();
</script>

</body>
</html>
